name: Atualizar partidas

on:
  schedule:
    - cron: '17 */6 * * *'   # a cada 6 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar dados no ewgf
        env:
          EWGF_TOKEN: ${{ secrets.EWGF_TOKEN }}
          TEKKEN_IDS: ${{ vars.TEKKEN_IDS }}
        run: node scripts/fetch.mjs

      - name: Commitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "dados: atualização automática"
            git push
          fi
